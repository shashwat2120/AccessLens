[project]
name = "accesslens"
version = "0.0.1"
description = "Audit Word documents for accessibility issues, mapped to WCAG 2.2."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml>=6.1.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "hypothesis>=6.170.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accesslens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/ holds pseudo-code sketches, not formattable Python.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"eval/**" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["accesslens"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["eval"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/accesslens"]

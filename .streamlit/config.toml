# Streamlit settings for the UI. The API enforces the same limit (MAX_UPLOAD_MB, default 10),
# so a file that is too big is stopped in the browser instead of after the upload.
[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0A5C99"
backgroundColor = "#F5F8FC"
secondaryBackgroundColor = "#E9F0F8"
textColor = "#14213D"
font = "sans serif"

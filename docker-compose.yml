# Local and demo deployment. Secrets come from a .env file next to this one (never committed).
# Required in .env: API_KEYS_SHA256 (SHA-256 hashes of the API keys) and ACCESSLENS_API_KEY
# (the plain key the UI sends). For AI review also set GEMINI_API_KEY, GROQ_API_KEY and the model names.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  api:
    <<: *hardened
    build:
      context: .
      target: api
    env_file: .env
    environment:
      APP_ENV: prod
    ports:
      - "127.0.0.1:8000:8000"

  ui:
    <<: *hardened
    build:
      context: .
      target: ui
    depends_on:
      api:
        condition: service_healthy
    environment:
      ACCESSLENS_API_URL: http://api:8000
      ACCESSLENS_API_KEY: ${ACCESSLENS_API_KEY:?set ACCESSLENS_API_KEY in .env}
    ports:
      - "127.0.0.1:8501:8501"
